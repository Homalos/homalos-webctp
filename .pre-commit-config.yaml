# Pre-commit 配置文件
# 在每次 git commit 前自动运行代码检查和格式化
#
# 安装方法：
#   1. pip install pre-commit
#   2. pre-commit install
#
# 手动运行所有检查：
#   pre-commit run --all-files
#
# 更新 hooks 到最新版本：
#   pre-commit autoupdate

repos:
  # Ruff - 快速的 Python 代码检查和格式化工具
  # 替代 flake8, isort, black 等多个工具
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.15
    hooks:
      # Ruff 代码检查
      - id: ruff
        name: Ruff 代码质量检查
        args:
          - --fix              # 自动修复可修复的问题
          - --exit-non-zero-on-fix  # 如果有修复，返回非零退出码
        description: 检查代码风格、未使用的导入、潜在错误等

      # Ruff 代码格式化
      - id: ruff-format
        name: Ruff 代码格式化
        description: 自动格式化 Python 代码（类似 black）

  # Python 代码安全检查
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        name: Bandit 安全检查
        additional_dependencies: ["bandit[toml]", "pbr"]
        description: 检查常见的安全问题
        language_version: python3
        exclude: ^(tests/|examples/|scripts/)

  # 通用文件检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # 清理尾随空格
      - id: trailing-whitespace
        name: 清理行尾空格
        description: 删除所有行尾的空格
        exclude: ^(.*\.md|.*\.txt)$  # 排除 Markdown 和文本文件

      # 确保文件以换行符结尾
      - id: end-of-file-fixer
        name: 修复文件末尾换行符
        description: 确保文件末尾有且仅有一个换行符

      # 检查 YAML 文件语法
      - id: check-yaml
        name: 检查 YAML 语法
        description: 验证 YAML 配置文件语法正确

      # 检查 JSON 文件语法
      - id: check-json
        name: 检查 JSON 语法
        description: 验证 JSON 文件语法正确

      # 检查 TOML 文件语法
      - id: check-toml
        name: 检查 TOML 语法
        description: 验证 TOML 文件语法正确

      # 检查是否有合并冲突标记
      - id: check-merge-conflict
        name: 检查合并冲突标记
        description: 防止提交包含合并冲突标记的文件

      # 检查是否添加了大文件
      - id: check-added-large-files
        name: 检查大文件
        args: [--maxkb=500]  # 限制 500KB
        description: 防止意外提交大文件

      # 检查是否有调试语句
      - id: debug-statements
        name: 检查调试语句
        description: 检查是否有 pdb, ipdb 等调试语句

      # 检查 Python 文件语法
      - id: check-ast
        name: 检查 Python 语法
        description: 验证 Python 文件语法正确

      # 检查文件名是否包含空格
      - id: check-case-conflict
        name: 检查文件名大小写冲突
        description: 防止在不区分大小写的文件系统上出现问题

      # 检查是否有私钥文件
      - id: detect-private-key
        name: 检测私钥文件
        description: 防止意外提交私钥文件

      # 修复 Python 编码声明
      - id: fix-encoding-pragma
        name: 修复编码声明
        args: [--remove]  # 移除编码声明（Python 3 默认 UTF-8）
        description: Python 3 不需要 # -*- coding: utf-8 -*-

  # 检查 requirements.txt 文件
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      # 检查 requirements.txt 中的包名
      - id: python-check-blanket-noqa
        name: 检查过于宽泛的 noqa
        description: 防止使用 # noqa 而不指定具体错误码

      # 检查 requirements.txt 中的包名
      - id: python-check-blanket-type-ignore
        name: 检查过于宽泛的 type ignore
        description: 防止使用 # type: ignore 而不指定具体错误码

      # 检查是否使用了 mock 而不是 unittest.mock
      - id: python-use-type-annotations
        name: 使用类型注解
        description: 鼓励使用类型注解而不是类型注释

  # Markdown 文件检查和格式化
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.17
    hooks:
      - id: mdformat
        name: Markdown 格式化
        additional_dependencies:
          - mdformat-gfm  # GitHub Flavored Markdown
          - mdformat-tables  # 表格支持
        description: 自动格式化 Markdown 文件

# 全局配置
default_language_version:
  python: python3.13  # 指定 Python 版本（Ruff 当前最高支持 3.12）

# 排除的文件和目录
exclude: |
  (?x)^(
      \.git/|
      \.venv/|
      __pycache__/|
      \.pytest_cache/|
      \.ruff_cache/|
      build/|
      dist/|
      .*\.egg-info/|
      PeopleQuant/|
      libs/|
      con_file/|
      flows/|
      logs/
  )$

# 失败时的行为
fail_fast: false  # 设置为 true 时，第一个失败就停止；false 时运行所有检查
